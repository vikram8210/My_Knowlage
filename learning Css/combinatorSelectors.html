<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinator Selectors</title>
    <link rel="stylesheet" href="combinatorSelectors.css">
</head>

<body>

    <!-- Decendent Combinator selector(CS) -->
    <div>
        <p>first paregraph</p>

        <section>
            <p>second paregraph</p>
        </section>
    </div>

    <!-- Child sibling CS -->
    <div>
        <q>child sibling of div</q>

        <section>
            <q>Cild sibling of section</q>
        </section>
    </div>
    <br>

    <!-- Adjecent CS -->
    <h3>adjecent</h3>
    <p>adjesent 1</p>
    <p>adjesent 2</p>
    <br>

    <!-- Genral Sibling CS -->
    <h2>Genral CS</h2>
    <p>genral para 1</p>
    <p>genral para 1</p>
    <p>genral para 1</p>
    <section>
        <p>genral para 1</p>

    </section>


    <!-- pseudo class Selector -->
    <div class="hover">
        <button type="submit">send</button>
    </div>

    <div class="active">
        <button>change color</button>
    </div>

    <div class="focus">
        <input type="text" id="">
    </div>

    <!-- Pseudo element selector -->
     <h1>Welcome to CSS</h1>

    <h2>Before and After Example</h2>

    <p class="letter"> learning CSS pseudo-elements.</p>

</body>

</html>
